name: beautifulyeti.auth

services:
  api:
    image: ${APP_IMAGE}
    container_name: by_auth_api
    restart: unless-stopped
    pull_policy: always
    profiles: [ "app" ]
    ports:
      - "8443:8443"
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OIDC_PROVIDER_URL: ${OIDC_PROVIDER_URL}
      OIDC_PROVIDER_LOGOUT_URL: ${OIDC_PROVIDER_LOGOUT_URL}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      REDIS_ADDRESS: by_auth_redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      SHARED_API_KEYS: ${SHARED_API_KEYS}
      USE_DEV_CERTS: ${USE_DEV_CERTS}
      SERVER_ADDRESS: ${SERVER_ADDRESS}
    networks:
      - proxy
      - internal
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "./server", "healthcheck", "-host", "localhost", "-port", "8443", "-insecure=true" ]
      interval: 5s
      timeout: 2s
      retries: 3

  redis:
    image: redis:8.6.1-alpine
    container_name: by_auth_redis
    restart: unless-stopped
    profiles: [ "infra" ]
    networks:
      - internal
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: backplane
  internal:
    external: true
    name: internal
